name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.19.0', '22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
  next-example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next: ['16.0.11', '16.1.7', '16.2.12', '16.3.5']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/next16-blog/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci
        working-directory: examples/next16-blog
      - run: npm install --no-save --package-lock=false next@${{ matrix.next }}
        working-directory: examples/next16-blog
      - run: npm run build
        working-directory: examples/next16-blog
      - run: node bin/next-cache-trace.js audit examples/next16-blog --fail-on warning
      - run: node bin/next-cache-trace.js audit examples/next16-cache-risks --format sarif --output artifacts/cache.sarif --fail-on none
      - uses: actions/upload-artifact@v4
        with:
          name: cache-report-next-${{ matrix.next }}
          path: artifacts/cache.sarif
  eslint-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false eslint@9.39.5
      - run: npm test
